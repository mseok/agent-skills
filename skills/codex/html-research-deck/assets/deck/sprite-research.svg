<svg xmlns="http://www.w3.org/2000/svg" class="sprite" width="0" height="0" style="position:absolute;left:0;top:0" aria-hidden="true" focusable="false">
  <!-- Shared shapes, gradients and arrowheads for research-theme scenes. new_deck.py inlines this file at the top of
       <body>; every inline <svg class="sc"> in the deck can then use href="#id" and fill="url(#id)".
       Shapes are bare (no fill/stroke): set them on each <use>. Coordinates are stage pixels, origin at the shape centre. -->
  <defs>
    <!-- soft shading: machinery (gray, steel), substrate (amber), small molecule (blue), cell and nucleus -->
    <radialGradient id="gGray" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E7EBEF"/><stop offset="1" stop-color="#D3DAE1"/></radialGradient>
    <radialGradient id="gSteel" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E2E9F2"/><stop offset="1" stop-color="#C9D6E5"/></radialGradient>
    <radialGradient id="gAmber" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFAF0"/><stop offset=".55" stop-color="#F8E3BF"/><stop offset="1" stop-color="#EBCB92"/></radialGradient>
    <radialGradient id="gBlue" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#93B1DE"/><stop offset=".6" stop-color="#4C72B0"/><stop offset="1" stop-color="#3A5A92"/></radialGradient>
    <radialGradient id="gCell" cx="42%" cy="36%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECEFF2"/></radialGradient>
    <radialGradient id="gNuc" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#F7F8FA"/><stop offset="1" stop-color="#DFE4E9"/></radialGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F8FA"/><stop offset=".35" stop-color="#DDE3E9"/><stop offset=".62" stop-color="#C5CDD5"/><stop offset="1" stop-color="#E3E8EC"/></linearGradient>
    <!-- arrowheads (concave back, 14 px, oriented along the path tangent): ah gray · ahd dark · ahb blue · ahc coral · ahl light -->
    <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#8E9AA6"/></marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#52606D"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#4C72B0"/></marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#E76F51"/></marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 L2.4 5 Z" fill="#CDD3D9"/></marker>
    <!-- proteins: generic blob; substrate with a zinc-finger knob (tip at -96,4); receptor with a pocket on the right (notch at x≈48–70, y −8…24); three-lobed adaptor -->
    <path id="shBlob" d="M -70,-20 C -64,-50 -20,-56 10,-50 C 44,-56 72,-34 74,-6 C 76,22 56,48 22,52 C -12,56 -48,50 -64,30 C -74,18 -74,0 -70,-20 Z"/>
    <path id="shIkzf" d="M -56,-24 C -46,-44 -12,-50 12,-46 C 40,-42 64,-26 66,-2 C 68,22 48,42 18,46 C -10,50 -40,44 -54,28 C -60,20 -62,14 -66,12 C -78,10 -94,12 -96,4 C -98,-6 -84,-12 -70,-10 C -62,-9 -60,-14 -56,-24 Z"/>
    <path id="shCrbn" d="M -30,-54 C 4,-62 44,-54 64,-30 C 72,-20 74,-12 70,-8 C 48,-4 48,20 70,24 C 76,32 70,46 54,54 C 30,64 -16,62 -46,50 C -74,38 -82,8 -70,-18 C -62,-38 -50,-50 -30,-54 Z"/>
    <path id="shDdb1" d="M -70,-10 C -60,-40 -20,-50 10,-40 C 40,-50 70,-30 72,-4 C 74,20 50,44 20,44 C -10,44 -30,34 -50,36 C -70,38 -82,10 -70,-10 Z"/>
    <path id="shKras" d="M -62,-30 C -40,-58 10,-62 46,-46 C 80,-30 86,8 70,34 C 54,58 10,62 -24,56 C -62,50 -86,22 -78,-8 C -74,-20 -70,-24 -62,-30 Z"/>
    <!-- small molecules: drug capsule 44×26; nucleotide capsule 50×24 (add white text on top) -->
    <rect id="shDrug" x="-22" y="-13" width="44" height="26" rx="13"/>
    <rect id="shNuc" x="-25" y="-12" width="50" height="24" rx="12"/>
    <!-- cell (322×224, x scaled 1.08 in cellBody) and nucleus (rx 97, ry 70) -->
    <path id="shCell" d="M -160,-10 C -162,-70 -110,-112 -30,-112 C 50,-114 130,-90 156,-30 C 178,26 140,90 70,106 C 0,122 -80,114 -128,76 C -156,54 -158,24 -160,-10 Z"/>
    <ellipse id="shNucleus" cx="0" cy="0" rx="97" ry="70"/>
    <g id="cellBody">
      <g transform="scale(1.08 1)"><use href="#shCell" fill="url(#gCell)" stroke="#8E9AA6" stroke-width="2.4"/></g>
      <use href="#shNucleus" x="-34" y="-4" fill="url(#gNuc)" stroke="#AAB3BC" stroke-width="1.8"/>
    </g>
    <!-- DNA: two interleaved waves, 120 px long, drawn from (0,0) to the right -->
    <g id="dna">
      <path d="M0 0 c 8 -7 16 7 24 0 c 8 -7 16 7 24 0 c 8 -7 16 7 24 0 c 8 -7 16 7 24 0 c 8 -7 16 7 24 0" fill="none" stroke="#8E9AA6" stroke-width="2.5"/>
      <path d="M0 0 c 8 7 16 -7 24 0 c 8 7 16 -7 24 0 c 8 7 16 -7 24 0 c 8 7 16 -7 24 0 c 8 7 16 -7 24 0" fill="none" stroke="#8E9AA6" stroke-width="2.5"/>
    </g>
    <!-- ubiquitin beads (13 px with text, 9 px plain) and the 26S proteasome (horizontal barrel, 202×124, centred) -->
    <g id="ub"><circle r="13" fill="#52606D" stroke="#FFFFFF" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Ub</text></g>
    <g id="ubS"><circle r="9" fill="#52606D" stroke="#FFFFFF" stroke-width="1.5"/></g>
    <g id="prot">
      <rect x="-101" y="-62" width="36" height="124" rx="15" fill="url(#gBar)" stroke="#8E9AA6" stroke-width="2"/>
      <rect x="-65" y="-48" width="130" height="96" rx="8" fill="url(#gBar)" stroke="#8E9AA6" stroke-width="2"/>
      <g stroke="#AEB7C0" stroke-width="1.5"><line x1="-32" y1="-48" x2="-32" y2="48"/><line x1="0" y1="-48" x2="0" y2="48"/><line x1="32" y1="-48" x2="32" y2="48"/></g>
      <rect x="65" y="-62" width="36" height="124" rx="15" fill="url(#gBar)" stroke="#8E9AA6" stroke-width="2"/>
    </g>
  </defs>
</svg>
