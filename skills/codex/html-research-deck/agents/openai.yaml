interface:
  display_name: "HTML Research Deck"
  short_description: "연구 기록에서 발표 흐름을 함께 정하고, 승인 뒤 연구 테마 HTML 덱(무대 위 그림·교과서식 장면)으로 제작해 PDF·미리보기까지 검증. Folio 양식과 PPTX는 요청 시"
  default_prompt: "Use $html-research-deck to develop a research presentation storyline with me from existing records, then build it as an HTML deck in the research theme after we agree on the flow, starting with a two- or three-slide taste benchmark."
